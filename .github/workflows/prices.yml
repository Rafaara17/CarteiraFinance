name: Atualizar preços

on:
  # Dias úteis, de hora em hora entre 10h e 21h UTC (~7h-18h BRT).
  schedule:
    - cron: "0 10-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: precos
  cancel-in-progress: true

jobs:
  precos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Buscar preços oficiais e gravar no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run fetch-prices

      - name: Creditar proventos (Yahoo) no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Corte de ativação: só credita proventos com data-ex a partir desta data.
          PROVENTOS_DESDE: "2026-07-24"
        run: npm run fetch-dividends
