name: Atualizar preços

on:
  # Dias úteis, de hora em hora entre 10h e 21h UTC (~7h-18h BRT).
  schedule:
    - cron: "0 10-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: precos
  cancel-in-progress: true

jobs:
  precos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Buscar preços oficiais
        run: npm run fetch-prices

      - name: Commitar snapshot
        run: |
          git config user.name "carteira-bot"
          git config user.email "bot@carteirafinance.local"
          if ! git diff --quiet -- data/prices/latest.json; then
            git add data/prices/latest.json
            git commit -m "precos: snapshot automatico $(date -u +%FT%TZ)"
            git push
          else
            echo "Sem mudanças de preço."
          fi
